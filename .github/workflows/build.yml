name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download game source
        run: |
          curl -sSL -o src.zip "https://muse.ai/files/1407546119102743/4802173803441418/hw85ea3q8ysh888jg4a4pf8p/zgs-source-v2-rebuild.zip"
          unzip -q src.zip

      - name: Build debug APK
        working-directory: zombie-gun-survival
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zombie-game-apk
          path: zombie-gun-survival/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
